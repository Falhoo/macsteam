name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Xcode 26 (Swift 6.2) is needed by NotProton's package and build.sh.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Steam compatibility tests
        # Fails the build when Valve's current Steam client breaks a macSteam patch
        # (signatures, Cloud-error / shared-library UI patches, Store cards).
        if: hashFiles('scripts/tests/steam_compat.py') != ''
        run: python3 scripts/tests/steam_compat.py

      - name: NotProton 1.2.6
        # build.sh merges NotProton's prebuilt parts (CrossOver bridge, fonts, helper
        # tools); it needs the 1.2.6 app, not a build of its sources.
        run: curl -fL --retry 3 -o NotProton.zip https://github.com/NotProtonNot/NotProton/releases/download/v1.2.6/NotProton.zip

      - name: Build the app
        run: ./build.sh --notproton-app NotProton.zip

      - name: Test the packages
        run: |
          (cd onlinefix && swift test)
          (cd macsteam-app && swift test)
          (cd notproton/app && swift test)

      - name: Package app
        run: ditto -c -k --keepParent "dist/macSteam.app" macSteam.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macSteam-${{ github.sha }}
          path: |
            macSteam.zip
            out/macsteam.dylib
          if-no-files-found: error
