name: Release (self-hosted)
# Same as release.yml, built on your own Mac (labels: self-hosted, macOS, ARM64).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.8.3)"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: ""

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Steam compatibility tests
        # Fails the build when Valve's current Steam client breaks a macSteam patch
        # (signatures, Cloud-error / shared-library UI patches, Store cards).
        if: hashFiles('scripts/tests/steam_compat.py') != ''
        run: python3 scripts/tests/steam_compat.py

      - name: Build the app
        # build.sh takes NotProton 1.2.6 from /Applications or ~/Downloads on this Mac;
        # pass --notproton-app PATH to use another copy or the release zip.
        run: ./build.sh

      - name: Test the packages
        run: |
          (cd onlinefix && swift test)
          (cd macsteam-app && swift test)
          (cd notproton/app && swift test)

      - name: Package DMG
        env:
          VERSION: ${{ inputs.version }}
        # The layout lives in scripts/make-dmg.sh: app on the left, Applications
        # on the right, over dmg/background.png.
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then brew install create-dmg; fi
          ./scripts/make-dmg.sh "macSteam-${VERSION}.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          DMG="macSteam-${VERSION}.dmg"
          NOTES="${RELEASE_NOTES:-macSteam v${VERSION}}"
          gh release create "v${VERSION}" "$DMG" \
            --title "v${VERSION}" \
            --notes "$NOTES"
